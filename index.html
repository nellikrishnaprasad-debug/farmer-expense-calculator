<!DOCTYPE html>
<html lang="te">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 Smart Farmer Expense Manager V2</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<button id="langBtn" onclick="changeLanguage()">
🌐 తెలుగు
</button>

<h1 id="title">
🌾 Smart Farmer Expense Manager
</h1>

<div class="section">

<h2>👨‍🌾 Farmer Details</h2>

<label>Farmer Name</label>
<input type="text" id="farmerName">

<label>Village</label>
<input type="text" id="village">

<label>Crop Name</label>

<select id="crop">

<option>వరి</option>
<option>పత్తి</option>
<option>మొక్కజొన్న</option>
<option>మిర్చి</option>
<option>పసుపు</option>
<option>ఇతర</option>

</select>

<label>Total Acres</label>
<input type="number" id="acres">

<label>Date</label>
<input type="date" id="date">

</div>

<div class="dashboard">

<div class="card">
<h3>💰 Expense</h3>
<h2 id="expenseCard">₹0</h2>
</div>

<div class="card">
<h3>💵 Income</h3>
<h2 id="incomeCard">₹0</h2>
</div>

<div class="card">
<h3>📈 Profit</h3>
<h2 id="profitCard">₹0</h2>
</div>

<div class="card">
<h3>🌾 Cost/Acre</h3>
<h2 id="acreCard">₹0</h2>
</div>

</div>

  <div class="section">

<h2>💰 Expense Details</h2>

<label>Seed Cost (₹)</label>
<input type="number" id="seed">

<label>Fertilizer Cost (₹)</label>
<input type="number" id="fert">

<label>Labour Cost (₹)</label>
<input type="number" id="labour">

<label>Pesticide Cost (₹)</label>
<input type="number" id="pesticide">

<label>Irrigation Cost (₹)</label>
<input type="number" id="irrigation">

<label>Tractor Cost (₹)</label>
<input type="number" id="tractor">

<label>Diesel Cost (₹)</label>
<input type="number" id="diesel">

<label>Other Expenses (₹)</label>
<input type="number" id="other">

</div>

<div class="section">

<h2>📈 Income Details</h2>

<label>Total Yield (Quintals)</label>
<input type="number" id="yield">

<label>Price Per Quintal (₹)</label>
<input type="number" id="price">

</div>

<button onclick="calculateExpense()">
💰 Calculate Expense
</button>

<button onclick="printReport()">
📄 Print Report
</button>

<button onclick="downloadPDF()">
📥 Download PDF
</button>

<button onclick="resetForm()">
🔄 Reset Form
</button>

<div class="section">

<h2>📊 Expense Chart</h2>

<canvas id="expenseChart"></canvas>

</div>

<div class="result" id="reportSection">

<h2>🌾 Smart Farmer Expense Report</h2>

<p>Total Expense : ₹0</p>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<script src="script.js"></script>

</body>
</html>
