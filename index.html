<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 Smart Farmer Expense Manager</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:linear-gradient(135deg,#dff6dd,#f5fff0);
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2e7d32;
margin-bottom:20px;
}

.section{
margin-top:20px;
padding:15px;
background:#f8fff6;
border-radius:10px;
border-left:5px solid #2e7d32;
}

.section h2{
color:#2e7d32;
margin-bottom:15px;
font-size:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.result{
margin-top:20px;
padding:15px;
background:#e8f5e9;
border-radius:10px;
font-size:20px;
font-weight:bold;
text-align:center;
}

@media(max-width:600px){

.container{
padding:15px;
}

h1{
font-size:24px;
}

}
</style>

</head>
<script>
function calculateExpense(){

let seed = Number(document.getElementById("seed").value) || 0;
let fert = Number(document.getElementById("fert").value) || 0;
let labour = Number(document.getElementById("labour").value) || 0;
let pesticide = Number(document.getElementById("pesticide").value) || 0;
let irrigation = Number(document.getElementById("irrigation").value) || 0;
let tractor = Number(document.getElementById("tractor").value) || 0;
let diesel = Number(document.getElementById("diesel").value) || 0;
let other = Number(document.getElementById("other").value) || 0;

let acres = Number(document.getElementById("acres").value) || 1;

let totalExpense =
seed + fert + labour + pesticide +
irrigation + tractor + diesel + other;

let perAcre = totalExpense / acres;
  let totalYield = Number(document.getElementById("yield").value) || 0;

let price = Number(document.getElementById("price").value) || 0;

let totalIncome = totalYield * price;

let profitLoss = totalIncome - totalExpense;

document.querySelector(".result").innerHTML =
`
<h2>🌾 Farm Report</h2>

<p>Total Expense: ₹ ${totalExpense.toLocaleString()}</p>

<p>Cost Per Acre: ₹ ${perAcre.toFixed(2)}</p>

<p>Total Income: ₹ ${totalIncome.toLocaleString()}</p>

<p>Profit / Loss: ₹ ${profitLoss.toLocaleString()}</p>
`;

}
</script>
<body>

<div class="container">

<h1>🌾 Smart Farmer Expense Manager</h1>

<div class="section">

<h2>👨‍🌾 Farmer Details</h2>

<label>Farmer Name</label>
<input type="text" id="farmerName">

<label>Village</label>
<input type="text" id="village">

<label>Crop Name</label>

<select id="crop">

<option>వరి</option>
<option>పత్తి</option>
<option>మొక్కజొన్న</option>
<option>మిర్చి</option>
<option>పసుపు</option>
<option>ఇతర</option>

</select>

<label>Total Acres</label>
<input type="number" id="acres">

<label>Date</label>
<input type="date" id="date">

</div>

<div class="section">

<h2>💰 Expense Details</h2>
  

<label>Seed Cost (₹)</label>
<input type="number" id="seed">

<label>Fertilizer Cost (₹)</label>
<input type="number" id="fert">

<label>Labour Cost (₹)</label>
<input type="number" id="labour">

<label>Pesticide Cost (₹)</label>
<input type="number" id="pesticide">

<label>Irrigation Cost (₹)</label>
<input type="number" id="irrigation">

<label>Tractor Cost (₹)</label>
<input type="number" id="tractor">

<label>Diesel Cost (₹)</label>
<input type="number" id="diesel">

<label>Other Expenses (₹)</label>
<input type="number" id="other">

</div>

  <div class="section">

<h2>📈 Income Details</h2>

<label>Total Yield (Quintals)</label>
<input type="number" id="yield">

<label>Price Per Quintal (₹)</label>
<input type="number" id="price">

</div>
  <button onclick="calculateExpense()">
Calculate Expense
  </button>

<div class="result">

Total Expense : ₹0

</div>

</div>

</body>
</html>
