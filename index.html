<!DOCTYPE html>
<html lang="te">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>🌾 Smart Farmer Expense Manager</title>

<link rel="stylesheet" href="style.css">

<script defer src="script.js"></script>

</head>

<body>

<div class="container">
<body>

<div class="container">

<button onclick="changeLanguage()" id="langBtn">
🌐 తెలుగు
</button>

<h1>🌾 Smart Farmer Expense Manager</h1>

<div class="section">
<h1>🌾 Smart Farmer Expense Manager</h1>

<div class="section">

<h2>👨‍🌾 Farmer Details</h2>

<label>Farmer Name</label>
<input type="text" id="farmerName">

<label>Village</label>
<input type="text" id="village">

<label>Crop Name</label>

<select id="crop">

<option>వరి</option>
<option>పత్తి</option>
<option>మొక్కజొన్న</option>
<option>మిర్చి</option>
<option>పసుపు</option>
<option>ఇతర</option>

</select>

<label>Total Acres</label>
<input type="number" id="acres">

<label>Date</label>
<input type="date" id="date">

</div>
<div class="dashboard">

<div class="card">
<h3>💰 Expense</h3>
<h2 id="expenseCard">₹0</h2>
</div>

<div class="card">
<h3>💵 Income</h3>
<h2 id="incomeCard">₹0</h2>
</div>

<div class="card">
<h3>📈 Profit</h3>
<h2 id="profitCard">₹0</h2>
</div>

<div class="card">
<h3>🌾 Cost/Acre</h3>
<h2 id="acreCard">₹0</h2>
</div>

</div>
<div class="result" id="reportSection">

Total Expense : ₹0

</div>
<div class="section">
<h2>📊 Expense Chart</h2>
<canvas id="expenseChart"></canvas>
  
<div class="section">
<h2>💰 Expense Details</h2>
  

<label>Seed Cost (₹)</label>
<input type="number" id="seed">

<label>Fertilizer Cost (₹)</label>
<input type="number" id="fert">

<label>Labour Cost (₹)</label>
<input type="number" id="labour">

<label>Pesticide Cost (₹)</label>
<input type="number" id="pesticide">

<label>Irrigation Cost (₹)</label>
<input type="number" id="irrigation">

<label>Tractor Cost (₹)</label>
<input type="number" id="tractor">

<label>Diesel Cost (₹)</label>
<input type="number" id="diesel">

<label>Other Expenses (₹)</label>
<input type="number" id="other">

</div>

  <div class="section">

<h2>📈 Income Details</h2>

<label>Total Yield (Quintals)</label>
<input type="number" id="yield">

<label>Price Per Quintal (₹)</label>
<input type="number" id="price">

</div>
  <button onclick="calculateExpense()">
Calculate Expense
  </button>
  <button onclick="printReport()">
📄 Print Report
  </button>

  <button onclick="downloadPDF()">
📄 Download PDF
  </button>

<button onclick="resetForm()">
🔄 Reset Form
</button>


</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js">
  function resetForm(){

if(confirm("Are you sure you want to reset all data?")){

document.querySelectorAll("input").forEach(input=>{
input.value="";
});

document.getElementById("crop").selectedIndex=0;

document.querySelector(".result").innerHTML="Total Expense : ₹0";

document.getElementById("expenseCard").innerHTML="₹0";
document.getElementById("incomeCard").innerHTML="₹0";
document.getElementById("profitCard").innerHTML="₹0";
document.getElementById("acreCard").innerHTML="₹0";

localStorage.clear();

if(chart){
chart.destroy();
chart=null;
}

}

  }
  function downloadPDF(){

const element = document.getElementById("reportSection");

const options = {

margin:0.5,

filename:"Farmer_Report.pdf",

image:{
type:"jpeg",
quality:1
},

html2canvas:{
scale:2
},

jsPDF:{
unit:"in",
format:"a4",
orientation:"portrait"
}

};

html2pdf().set(options).from(element).save();

}
</script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</body>
</html>
