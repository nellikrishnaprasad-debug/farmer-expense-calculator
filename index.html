<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌾 Smart Farmer Expense Manager</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}
  
body{
background:linear-gradient(135deg,#dff6dd,#f5fff0);
padding:20px;
}

.container{
max-width:700px;
margin:auto;
background:#fff;
padding:20px;
border-radius:15px;
box-shadow:0 8px 20px rgba(0,0,0,.15);
}

h1{
text-align:center;
color:#2e7d32;
margin-bottom:20px;
}

.section{
margin-top:20px;
padding:15px;
background:#f8fff6;
border-radius:10px;
border-left:5px solid #2e7d32;
}

.section h2{
color:#2e7d32;
margin-bottom:15px;
font-size:20px;
}

label{
display:block;
margin-top:12px;
font-weight:bold;
}

input,select{
width:100%;
padding:12px;
margin-top:5px;
border:1px solid #ccc;
border-radius:8px;
font-size:16px;
}

button{
width:100%;
padding:14px;
margin-top:20px;
background:#2e7d32;
color:white;
border:none;
border-radius:8px;
font-size:18px;
cursor:pointer;
}

button:hover{
background:#1b5e20;
}

.result{
margin-top:20px;
padding:15px;
background:#e8f5e9;
border-radius:10px;
font-size:20px;
font-weight:bold;
text-align:center;
}

@media(max-width:600px){

.container{
padding:15px;
}

h1{
font-size:24px;
}

}
  .dashboard{
display:grid;
grid-template-columns:repeat(2,1fr);
gap:15px;
margin-top:20px;
}

.card{
background:#fff;
border-radius:12px;
padding:15px;
text-align:center;
box-shadow:0 5px 10px rgba(0,0,0,.15);
border-left:5px solid #2e7d32;
}

.card h3{
color:#2e7d32;
font-size:18px;
margin-bottom:8px;
}

.card h2{
font-size:24px;
color:#111;
}

@media(max-width:600px){
.dashboard{
grid-template-columns:1fr;
}
}
  button:last-of-type{
background:#d32f2f;
}

button:last-of-type:hover{
background:#b71c1c;
}
</style>

</head>
<script>
  let chart = null;
function calculateExpense(){

let seed = Number(document.getElementById("seed").value) || 0;
let fert = Number(document.getElementById("fert").value) || 0;
let labour = Number(document.getElementById("labour").value) || 0;
let pesticide = Number(document.getElementById("pesticide").value) || 0;
let irrigation = Number(document.getElementById("irrigation").value) || 0;
let tractor = Number(document.getElementById("tractor").value) || 0;
let diesel = Number(document.getElementById("diesel").value) || 0;
let other = Number(document.getElementById("other").value) || 0;

let acres = Number(document.getElementById("acres").value) || 1;

let totalExpense = seed + fert + labour + pesticide +
irrigation + tractor + diesel + other;

let perAcre = totalExpense / acres;

let totalYield = Number(document.getElementById("yield").value) || 0;
let price = Number(document.getElementById("price").value) || 0;

let totalIncome = totalYield * price;
let profitLoss = totalIncome - totalExpense;

let color = profitLoss >= 0 ? "green" : "red";

document.querySelector(".result").innerHTML = `
<h2>🌾 Farm Report</h2>

<p>Total Expense: ₹ ${totalExpense.toLocaleString()}</p>

<p>Cost Per Acre: ₹ ${perAcre.toFixed(2)}</p>

<p>Total Income: ₹ ${totalIncome.toLocaleString()}</p>

<p style="color:${color};font-weight:bold;">
Profit / Loss: ₹ ${profitLoss.toLocaleString()}
</p>
`;
if(chart){
    chart.destroy();
}

const ctx = document.getElementById("expenseChart").getContext("2d");

chart = new Chart(ctx,{
    type:"pie",
    data:{
        labels:[
            "Seed",
            "Fertilizer",
            "Labour",
            "Pesticide",
            "Irrigation",
            "Tractor",
            "Diesel",
            "Other"
        ],
        datasets:[{
            data:[
                seed,
                fert,
                labour,
                pesticide,
                irrigation,
                tractor,
                diesel,
                other
            ]
        }]
    },
    options:{
        responsive:true
    }
});
  document.getElementById("expenseCard").innerHTML =
"₹ " + totalExpense.toLocaleString();

document.getElementById("incomeCard").innerHTML =
"₹ " + totalIncome.toLocaleString();

document.getElementById("profitCard").innerHTML =
"₹ " + profitLoss.toLocaleString();

document.getElementById("acreCard").innerHTML =
"₹ " + perAcre.toFixed(2);
saveData();

}
function printReport(){

let farmer = document.getElementById("farmerName").value || "N/A";
let village = document.getElementById("village").value || "N/A";
let crop = document.getElementById("crop").value || "N/A";
let date = document.getElementById("date").value || "N/A";

let report = document.querySelector(".result").innerHTML;

let printContent = `
<html>
<head>
<title>Farmer Report</title>

<style>
body{
font-family:Arial;
padding:20px;
}

h1{
text-align:center;
color:green;
}

.box{
border:1px solid #ccc;
padding:15px;
border-radius:10px;
}

</style>
</head>

<body>

<h1>🌾 Smart Farmer Report</h1>

<div class="box">

<h3>Farmer Details</h3>

<p>Farmer Name: ${farmer}</p>
<p>Village: ${village}</p>
<p>Crop: ${crop}</p>
<p>Date: ${date}</p>

<hr>

<h3>Calculation Report</h3>

${report}

</div>

</body>
</html>
`;

let newWindow = window.open();

newWindow.document.write(printContent);

newWindow.document.close();

newWindow.print();

}
  function saveData() {

const ids = [
"farmerName","village","crop","date","acres",
"seed","fert","labour","pesticide",
"irrigation","tractor","diesel","other",
"yield","price"
];

ids.forEach(id=>{
localStorage.setItem(id, document.getElementById(id).value);
});

}

function loadData() {

const ids = [
"farmerName","village","crop","date","acres",
"seed","fert","labour","pesticide",
"irrigation","tractor","diesel","other",
"yield","price"
];

ids.forEach(id=>{
let value = localStorage.getItem(id);
if(value !== null){
document.getElementById(id).value = value;
}
});

}

window.onload = loadData;
  let telugu = false;

function changeLanguage(){

telugu = !telugu;

if(telugu){

document.getElementById("langBtn").innerHTML="🌐 English";

document.querySelector("h1").innerHTML="🌾 స్మార్ట్ రైతు ఖర్చుల కాలిక్యులేటర్";

document.querySelectorAll("label")[0].innerHTML="రైతు పేరు";
document.querySelectorAll("label")[1].innerHTML="గ్రామం";
document.querySelectorAll("label")[2].innerHTML="పంట మొత్తం ఎకరాలు";
document.querySelectorAll("label")[3].innerHTML="తేదీ";

document.querySelectorAll("label")[4].innerHTML="విత్తనాల ఖర్చు";
document.querySelectorAll("label")[5].innerHTML="ఎరువుల ఖర్చు";
document.querySelectorAll("label")[6].innerHTML="కూలీల ఖర్చు";
document.querySelectorAll("label")[7].innerHTML="పురుగుమందుల ఖర్చు";
document.querySelectorAll("label")[8].innerHTML="నీటి ఖర్చు";
document.querySelectorAll("label")[9].innerHTML="ట్రాక్టర్ ఖర్చు";
document.querySelectorAll("label")[10].innerHTML="డీజిల్ ఖర్చు";
document.querySelectorAll("label")[11].innerHTML="ఇతర ఖర్చులు";

document.querySelectorAll("label")[12].innerHTML="మొత్తం దిగుబడి (క్వింటాళ్లు)";
document.querySelectorAll("label")[13].innerHTML="క్వింటాల్ ధర";

}else{

document.getElementById("langBtn").innerHTML="🌐 తెలుగు";

document.querySelector("h1").innerHTML="🌾 Smart Farmer Expense Manager";

document.querySelectorAll("label")[0].innerHTML="Farmer Name";
document.querySelectorAll("label")[1].innerHTML="Village";
document.querySelectorAll("label")[2].innerHTML="Total Acres";
document.querySelectorAll("label")[3].innerHTML="Date";

document.querySelectorAll("label")[4].innerHTML="Seed Cost";
document.querySelectorAll("label")[5].innerHTML="Fertilizer Cost";
document.querySelectorAll("label")[6].innerHTML="Labour Cost";
document.querySelectorAll("label")[7].innerHTML="Pesticide Cost";
document.querySelectorAll("label")[8].innerHTML="Irrigation Cost";
document.querySelectorAll("label")[9].innerHTML="Tractor Cost";
document.querySelectorAll("label")[10].innerHTML="Diesel Cost";
document.querySelectorAll("label")[11].innerHTML="Other Expenses";

document.querySelectorAll("label")[12].innerHTML="Total Yield (Quintals)";
document.querySelectorAll("label")[13].innerHTML="Price Per Quintal";

}

}
</script>
<body>

<div class="container">
<body>

<div class="container">

<button onclick="changeLanguage()" id="langBtn">
🌐 తెలుగు
</button>

<h1>🌾 Smart Farmer Expense Manager</h1>

<div class="section">
<h1>🌾 Smart Farmer Expense Manager</h1>

<div class="section">

<h2>👨‍🌾 Farmer Details</h2>

<label>Farmer Name</label>
<input type="text" id="farmerName">

<label>Village</label>
<input type="text" id="village">

<label>Crop Name</label>

<select id="crop">

<option>వరి</option>
<option>పత్తి</option>
<option>మొక్కజొన్న</option>
<option>మిర్చి</option>
<option>పసుపు</option>
<option>ఇతర</option>

</select>

<label>Total Acres</label>
<input type="number" id="acres">

<label>Date</label>
<input type="date" id="date">

</div>
<div class="dashboard">

<div class="card">
<h3>💰 Expense</h3>
<h2 id="expenseCard">₹0</h2>
</div>

<div class="card">
<h3>💵 Income</h3>
<h2 id="incomeCard">₹0</h2>
</div>

<div class="card">
<h3>📈 Profit</h3>
<h2 id="profitCard">₹0</h2>
</div>

<div class="card">
<h3>🌾 Cost/Acre</h3>
<h2 id="acreCard">₹0</h2>
</div>

</div>
<div class="result">

Total Expense : ₹0

</div>
<div class="section">
<h2>📊 Expense Chart</h2>
<canvas id="expenseChart"></canvas>
  
<div class="section">
<h2>💰 Expense Details</h2>
  

<label>Seed Cost (₹)</label>
<input type="number" id="seed">

<label>Fertilizer Cost (₹)</label>
<input type="number" id="fert">

<label>Labour Cost (₹)</label>
<input type="number" id="labour">

<label>Pesticide Cost (₹)</label>
<input type="number" id="pesticide">

<label>Irrigation Cost (₹)</label>
<input type="number" id="irrigation">

<label>Tractor Cost (₹)</label>
<input type="number" id="tractor">

<label>Diesel Cost (₹)</label>
<input type="number" id="diesel">

<label>Other Expenses (₹)</label>
<input type="number" id="other">

</div>

  <div class="section">

<h2>📈 Income Details</h2>

<label>Total Yield (Quintals)</label>
<input type="number" id="yield">

<label>Price Per Quintal (₹)</label>
<input type="number" id="price">

</div>
  <button onclick="calculateExpense()">
Calculate Expense
  </button>
  <button onclick="printReport()">
📄 Print Report
  </button>

<button onclick="resetForm()">
🔄 Reset Form
</button>


</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js">
  function resetForm(){

if(confirm("Are you sure you want to reset all data?")){

document.querySelectorAll("input").forEach(input=>{
input.value="";
});

document.getElementById("crop").selectedIndex=0;

document.querySelector(".result").innerHTML="Total Expense : ₹0";

document.getElementById("expenseCard").innerHTML="₹0";
document.getElementById("incomeCard").innerHTML="₹0";
document.getElementById("profitCard").innerHTML="₹0";
document.getElementById("acreCard").innerHTML="₹0";

localStorage.clear();

if(chart){
chart.destroy();
chart=null;
}

}

  }
</script>
</body>
</html>
